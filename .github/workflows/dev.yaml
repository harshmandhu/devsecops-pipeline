name: dev-flow
on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
       
env:
  ECR_REPOSITORY: 'myapp-image'
permissions:
  contents: read
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Maven Build
        run: mvn install
      - name: Upload Build Artifact (WAR)
        uses: actions/upload-artifact@v4
        with:
          name: myapp
          path: target/*.war
      - name: Notify if Build Fails
        if: failure()
        run: echo "Build Job Failed, Please check logs."    

  Testing:  
    runs-on: ubuntu-latest
    needs: Build 
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run tests on main branch
        if: github.ref == 'refs/heads/main'
        run: mvn test
      - name: Checkstyle
        if: github.ref == 'refs/heads/main'
        run: mvn checkstyle:checkstyle
      - name: Run tests on other branches
        if: github.ref != 'refs/heads/main'
        run: echo "Skipping unit tests and code analysis"

  Security_Scan:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Code Checkout 
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ LEVEL 1 — Filesystem scan (source code level)
      # Scans your source code and dependencies BEFORE building image
      # exit-code: 0 means it reports but does not fail pipeline
      # purpose: early warning, visibility into code vulnerabilities
      - name: Trivy Filesystem Scan (Source Code)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          exit-code: 0
          severity: CRITICAL,HIGH
          vuln-type: os,library
          output: trivy-fs-results.json

      - name: Upload Filesystem Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-scan-results
          path: trivy-fs-results.json

  BUILD_AND_PUBLISH:
    name: BUILD_AND_PUBLISH
    runs-on: ubuntu-latest
    environment: production
    needs: [Build, Testing, Security_Scan]        
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}} 
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: ${{vars.AWS_REGION}}   

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build image first, do NOT push yet
      - name: Build and Tag Docker Image
        id: build-image
        env: 
          ECR_REGISTRY: ${{steps.login-ecr.outputs.registry}}
          IMAGE_TAG: ${{github.sha}}
        run: |
          docker build -f Docker-files/app/multistage/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      # ✅ LEVEL 2 — Image scan (Docker image level)
      # Scans the built Docker image BEFORE pushing to ECR
      # exit-code: 1 means pipeline FAILS if critical CVE found
      # purpose: block vulnerable images from reaching ECR
      - name: Trivy Image Scan (Docker Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{steps.login-ecr.outputs.registry}}/${{env.ECR_REPOSITORY}}:${{github.sha}}
          scan-type: image
          format: table
          exit-code: 1
          severity: CRITICAL
          vuln-type: os,library

      # Only runs if image scan passes
      - name: Push Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{steps.login-ecr.outputs.registry}}
          IMAGE_TAG: ${{github.sha}}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT