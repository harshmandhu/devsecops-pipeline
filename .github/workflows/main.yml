name: my-workflow

on: 
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read      

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout 
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Maven Build
        run: mvn install

      - name: Upload Build Artifect (WAR)
        uses: actions/upload-artifact@v4
        with:
          name: myapp
          path: target/*.war

      - name: Notify if Build Fails
        if: failure()
        run: echo "Build Job Failed! Please Check Logs"          

  Testing:      
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Code checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: run tests on main branch
        run: mvn test

      - name: Checkstyle
        run: mvn checkstyle:checkstyle
